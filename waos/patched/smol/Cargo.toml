[package]
name = "smol"
version = "2.0.2"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "WaOS port, from the 10-16 experiment: smol 2.0.2's API, built from the same crates, leaving out the parts on async-io's reactor on WASI"
publish = false

[dependencies]
async-channel = "2.0.0"
async-executor = "1.5.0"
async-fs = "2.0.0"
async-lock = "3.0.0"
blocking = "1.3.0"
futures-lite = "2.0.0"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
async-io = "2.1.0"
async-net = "2.0.0"
async-process = "2.0.0"
