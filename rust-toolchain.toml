# WaOS port: WaOS's toolchain (rust-toolchain.toml in WaOS), whose wasm32-wasip3 a program is built for.
# Upstream: 1.98.1 with rust-analyzer, rust-src and the web and Linux targets.
[toolchain]
channel = "nightly-2026-11-15"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["wasm32-wasip3"]
