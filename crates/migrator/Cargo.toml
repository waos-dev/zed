[package]
name = "migrator"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/migrator.rs"
doctest = false

[dependencies]
anyhow.workspace = true
collections.workspace = true
convert_case.workspace = true
log.workspace = true
streaming-iterator.workspace = true
tree-sitter-json.workspace = true
tree-sitter.workspace = true
serde_json_lenient.workspace = true
serde_json.workspace = true
settings_content.workspace = true
settings_json = { workspace = true, features = ["editing"] }

[dev-dependencies]
indoc.workspace = true
pretty_assertions.workspace = true

# WaOS port: grammars compiled to wasm need wasmtime, which a WASI component cannot hold; the
# built-in grammars are native code.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
tree-sitter = { workspace = true, features = ["wasm"] }
